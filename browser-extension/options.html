<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ClipOps Operator Options</title>
    <style>
      body {
        font: 14px/1.4 system-ui, sans-serif;
        max-width: 520px;
        margin: 32px auto;
        padding: 0 16px;
        background: #14181f;
        color: #e8ecf1;
      }
      label {
        display: block;
        margin-top: 12px;
        font-size: 12px;
        color: #8b93a3;
      }
      input {
        width: 100%;
        margin-top: 4px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #2a3140;
        background: #1e2530;
        color: #e8ecf1;
      }
      button {
        margin-top: 16px;
        padding: 8px 14px;
        border-radius: 6px;
        border: 0;
        background: #2a9d8f;
        color: #041210;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #8b93a3;
      }
      code {
        background: #1e2530;
        padding: 2px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>ClipOps Operator Options</h1>
    <p>
      Login to ClipOps API, paste the JWT here. Extension only assists your
      logged-in Content Rewards tab — it never auto-posts or auto-withdraws.
    </p>
    <label>API base URL</label>
    <input id="apiBase" value="http://127.0.0.1:8000" />
    <label>Operator email</label>
    <input id="email" value="operator@clipops.local" />
    <label>Password</label>
    <input id="password" type="password" value="changeme" />
    <label>JWT token (auto-filled on login)</label>
    <input id="token" />
    <label>Active discovered campaign id (for brief push)</label>
    <input id="lastDiscoveredId" />
    <button id="login">Login & save</button>
    <button id="save" style="background: #1e2530; color: #e8ecf1; border: 1px solid #2a3140">
      Save only
    </button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
