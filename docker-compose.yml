services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clipops
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/20260727100000_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./workers:/app/workers
      - ./storage:/app/storage
    depends_on:
      - redis
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: celery -A app.celery_app.celery worker --loglevel=info --concurrency=1
    env_file: .env
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./workers:/app/workers
      - ./storage:/app/storage
      - ./templates:/app/templates
    depends_on:
      - redis
      - api
    # Uncomment when NVIDIA Container Toolkit + WSL2 GPU is configured:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  remotion:
    build:
      context: ./templates
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    volumes:
      - ./templates:/app
      - ./storage:/storage

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Toronto
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows/n8n:/workflows
    depends_on:
      - api
      - redis

volumes:
  postgres_data:
  redis_data:
  n8n_data:
